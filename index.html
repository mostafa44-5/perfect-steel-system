<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Perfect Steel Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --primary: #FF6B00; 
            --primary-dark: #E66000;
            --bg-body: #0B0F19; 
            --bg-card: rgba(30, 41, 59, 0.65);
            --text-main: #F8FAFC;
            --text-dim: #94A3B8;
            --success: #10B981;
            --danger: #EF4444;
            --border: rgba(255, 255, 255, 0.08);
            --radius: 16px;
            --revenue-color: #ffcc00;
            --overlay-bg: rgba(11, 15, 25, 0.75);
        }

        [data-theme="light"] {
            --bg-body: #F1F5F9;
            --bg-card: rgba(255, 255, 255, 0.85);
            --text-main: #0F172A;
            --text-dim: #64748B;
            --border: rgba(0, 0, 0, 0.08);
            --overlay-bg: rgba(241, 245, 249, 0.75);
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            touch-action: manipulation; 
        }

        body {
            font-family: 'Noto Kufi Arabic', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0; padding: 0;
            overflow-x: hidden; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .bg-fixed {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; 
            background-image: linear-gradient(var(--overlay-bg), var(--overlay-bg)), 
            url('https://images.unsplash.com/photo-1541888946425-d81bb19240f5?q=80&w=1200');
            background-size: cover; background-position: center;
            animation: kenBurns 25s infinite alternate ease-in-out;
            will-change: transform;
            transition: background-image 0.3s ease;
        }
        @keyframes kenBurns {
            0% { transform: scale(1); } 100% { transform: scale(1.06); }
        }

        header {
            width: 100%; padding: 5px 15px;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.4); z-index: 150;
            display: flex; justify-content: space-between; align-items: center;
            height: 90px; position: sticky; top: 0;
        }
        
        .logo { position: absolute; left: 50%; transform: translateX(-50%); pointer-events: none; }
        .logo h1 { color: var(--primary); font-size: 18px; margin: 0; font-weight: 900; letter-spacing: 1px; }
        
        .header-right-holder {
            display: flex; flex-direction: column; align-items: flex-start; gap: 5px; z-index: 120; min-height: 60px; justify-content: center;
        }

        .menu-trigger {
            background: none; border: none; color: var(--text-main); font-size: 22px; cursor: pointer; padding: 0; opacity: 0; pointer-events: none; transition: 0.2s;
        }
        .menu-trigger.visible { opacity: 1; pointer-events: auto; }

        .header-left-holder {
            display: flex; align-items: center; gap: 12px; z-index: 130;
        }

        .user-site-column {
            display: flex; flex-direction: column; align-items: flex-end; gap: 4px; min-width: 120px;
        }

        /* بادج اسم المهندس جوه الهيدر */
        .header-user-badge {
            display: none; align-items: center; gap: 5px; font-size: 11px; font-weight: bold; color: var(--text-main); background: rgba(255, 255, 255, 0.03); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border);
        }
        .header-user-badge.active-live { display: flex !important; }
        .header-user-badge i { color: var(--primary); font-size: 12px; }

        /* بادج الموقع */
        .header-project-badge {
            display: none; background: rgba(255, 107, 0, 0.12); border: 1px solid rgba(255,107,0,0.4); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer; align-items: center; gap: 5px; color: var(--text-main); transition: all 0.2s;
        }
        .header-project-badge.active-live { display: flex !important; }

        /* الكلاسات العامة للاختفاء والظهور المضمون */
        .hidden-element { display: none !important; }
        .visible-element { display: block !important; }

        /* 🚪 القائمة الجانبية */
        .sidebar {
            position: fixed; top: 0; right: -280px; width: 260px; height: 100%;
            background: var(--bg-body); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 200; border-left: 1px solid var(--border); padding: 25px 20px;
            display: flex; flex-direction: column; gap: 20px;
            transition: right 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .sidebar.open { right: 0; box-shadow: -15px 0 35px rgba(0,0,0,0.4); }

        .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        .sidebar-close { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; }
        .sidebar-user-info { background: rgba(255,255,255,0.02); padding: 12px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
        .sidebar-user-info i { color: var(--primary); font-size: 20px; margin-bottom: 5px; display: block; }

        .sidebar-theme-row {
            display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.03); padding: 12px; border-radius: 12px; border: 1px solid var(--border); cursor: pointer; transition: 0.2s ease;
        }
        .sidebar-theme-row:active { transform: scale(0.98); }
        .sidebar-theme-info { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: bold; }
        .sidebar-theme-info i { color: var(--primary); font-size: 16px; width: 20px; text-align: center; }
        .theme-status-text { font-size: 11px; color: var(--text-dim); }
        
        .btn-logout {
            margin-top: auto; width: 100%; padding: 12px; background: rgba(239, 68, 68, 0.12); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.25); border-radius: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 190; display: none; }

        /* حاوية الأبلكيشن */
        .app-container {
            width: 100%; max-width: 480px; padding: 15px 12px 30px; z-index: 5;
            display: flex; flex-direction: column; gap: 15px;
        }

        .login-box {
            background: var(--bg-card); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 12px 30px rgba(0,0,0,0.3); width: 100%;
        }

        .project-selector-card { transition: opacity 0.3s; }
        .project-selector-card.hide-completely { display: none !important; }

        .main-content { display: none; opacity: 0; transform: translateY(15px); transition: all 0.5s ease; width: 100%; }
        .main-content.visible { display: flex !important; flex-direction: column; gap: 15px; opacity: 1; transform: translateY(0); }

        .card {
            background: var(--bg-card); border-radius: var(--radius); padding: 18px; border: 1px solid var(--border); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 10px 25px rgba(0,0,0,0.2); transition: background-color 0.3s, border-color 0.3s;
        }

        .label-group label { display: block; margin-bottom: 6px; font-size: 12px; color: var(--text-dim); font-weight: bold; }
        
        .input-ui { width: 100%; background-color: rgba(15, 23, 42, 0.05); border: 1px solid var(--border); border-radius: 12px; padding: 12px; color: var(--text-main); font-size: 14px; font-family: inherit; outline: none; transition: 0.2s; }
        [data-theme="dark"] .input-ui { background-color: rgba(15, 23, 42, 0.6); }
        .input-ui:focus { border-color: var(--primary); }
        select.input-ui { color: var(--primary); font-weight: bold; }

        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        .btn-outline { padding: 10px; background: rgba(15, 23, 42, 0.03); border: 1px solid var(--border); color: var(--text-main); border-radius: 8px; font-size: 11px; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px; }
        [data-theme="dark"] .btn-outline { background: rgba(15, 23, 42, 0.4); }

        .stats-hud-row { display: grid; grid-template-columns: 1.2fr 0.9fr 0.9fr; gap: 6px; width: 100%; }
        .hud-box { background: var(--bg-card); border: 1px solid var(--border); padding: 10px 6px; border-radius: 12px; text-align: center; transition: background-color 0.3s; }
        .hud-box.prime { border-top: 2px solid var(--primary); background: rgba(255, 107, 0, 0.04); }
        .hud-box h4 { margin: 0; font-size: 10px; color: var(--text-dim); font-weight: bold; }
        .hud-box .val { margin: 4px 0 0; font-size: 13px; font-weight: 900; white-space: nowrap; }

        .tabs { display: flex; background: rgba(15, 23, 42, 0.05); padding: 4px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 12px; }
        [data-theme="dark"] .tabs { background: rgba(15, 23, 42, 0.8); }
        .tab-btn { flex: 1; padding: 10px; border: none; background: none; color: var(--text-dim); font-weight: bold; font-size: 13px; border-radius: 7px; cursor: pointer; font-family: inherit; }
        .tab-btn.active { background: var(--primary); color: white; }

        .btn-primary { width: 100%; padding: 14px; background-color: var(--primary); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; }

        .logs-list { max-height: 380px; overflow-y: auto; -webkit-overflow-scrolling: touch; will-change: transform; }
        .log-item { background: var(--bg-card); border-radius: 12px; padding: 12px; margin-bottom: 8px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; transition: background-color 0.3s; }
        .log-item.income { border-left: 3px solid var(--success); }
        .log-item.expense { border-left: 3px solid var(--danger); }
        .log-info h5 { margin: 0; font-size: 13px; font-weight: 700; color: var(--text-main); }
        .log-info p { margin: 3px 0 0; font-size: 10px; color: var(--text-dim); }
        .log-amount { text-align: left; }
        .log-amount .amt { display: block; font-size: 14px; font-weight: 800; }
        .log-amount .date { font-size: 9px; color: var(--text-dim); }

        .btn-del { background: rgba(239, 68, 68, 0.08); color: var(--danger); border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-right: 8px; }

        .loading-shimmer { position: fixed; top: 0; left:0; width: 100%; height: 100%; background: var(--bg-body); opacity: 0.95; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="bg-fixed"></div>

    <div class="loading-shimmer" id="loading">
        <i class="fas fa-cog fa-spin" style="font-size: 35px; color: var(--primary);"></i>
        <p style="margin-top: 12px; font-weight: bold; font-size: 13px;">مزامنة السيرفر الفوري... ⚡</p>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>

    <div class="sidebar" id="sidebarMenu">
        <div class="sidebar-header">
            <span style="font-weight: 900; color: var(--primary); font-size: 14px;">إدارة النظام</span>
            <button class="sidebar-close" onclick="toggleSidebar(false)"><i class="fas fa-times"></i></button>
        </div>
        <div class="sidebar-user-info">
            <i class="fas fa-user-hard-hat"></i>
            <span id="sidebarUserName">Eng: User</span>
        </div>

        <div class="sidebar-theme-row" onclick="toggleTheme()">
             <div class="sidebar-theme-info">
                  <i class="fas fa-moon" id="menuThemeIcon"></i>
                  <span>مظهر التطبيق</span>
             </div>
             <span class="theme-status-text" id="menuThemeStatus">وضع ليلي</span>
        </div>

        <button class="btn-logout" onclick="triggerLogOut()">
            <i class="fas fa-door-open"></i> تسجيل الخروج
        </button>
    </div>

    <header>
        <div class="header-right-holder">
             <button class="menu-trigger" id="menuBtn" onclick="toggleSidebar(true)"><i class="fas fa-bars"></i></button>
        </div>
        <div class="logo"><h1>PERFECT STEEL</h1></div>
        
        <div class="header-left-holder">
             <div class="user-site-column">
                  <div class="header-user-badge" id="headerUserBadge">
                       <i class="fas fa-user-hard-hat"></i>
                       <span id="headerUserNameSpan">Eng: USER</span>
                  </div>
                  
                  <div class="header-project-badge" id="headerProjBadge" onclick="resetProjectSelection()">
                       <i class="fas fa-map-marker-alt"></i>
                       <span id="headerProjName">الموقع</span>
                  </div>
             </div>
        </div>
    </header>

    <div class="app-container">
        
        <div class="login-box" id="loginBox">
            <div>
                <div class="label-group">
                    <label><i class="fas fa-user-gear" style="color: var(--primary);"></i> تسجيل دخول المهندس المسؤول</label>
                    <select class="input-ui" id="userSelect" onchange="checkUserAuth()">
                        <option value="" disabled selected>اختر اسمك من هنا..</option>
                        <option value="mostafa">Eng: Mostafa</option>
                        <option value="ahmed">Eng: Ahmed</option>
                        <option value="mohamed">Eng: Mohamed</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="main-content" id="mainContent">
            
            <div class="card project-selector-card" id="projectSelectorCard">
                <div class="label-group">
                    <label><i class="fas fa-cubes" style="color: var(--primary);"></i> اختيار موقع العمل الحالي</label>
                    <select class="input-ui" id="projectSelect" onchange="onProjectChange()">
                        <option value="" disabled selected>اختر المشروع للمتابعة..</option>
                        <option value="New Cairo">New Cairo</option>
                        <option value="Old Cairo">Old Cairo</option>
                        <option value="Helwan">Helwan</option>
                        <option value="Ismailia">Ismailia</option>
                    </select>
                </div>
                <div class="admin-grid" id="adminBox">
                    <button class="btn-outline" onclick="addCustomProject()"><i class="fas fa-plus"></i> مشروع</button>
                    <button class="btn-outline" onclick="addCustomEmployee()"><i class="fas fa-user-plus"></i> مهندس</button>
                    <a class="btn-outline" href="https://docs.google.com/spreadsheets/d/1k5KcOhR8XTzS0kAi-SWM7OJE0oCLvoKuAK9RfE4EmAg/edit" target="_blank"><i class="fas fa-file-invoice-dollar"></i> المرتبات</a>
                    <a class="btn-outline" href="https://docs.google.com/spreadsheets/d/1I9QkNu2qjRFUTJcMuL3qo5f7scQaxQT_t-OVdm7ujVI/edit" target="_blank"><i class="fas fa-calendar-check"></i> الحضور</a>
                </div>
            </div>

            <div class="card hidden-element" id="revenueCard" style="display: none;">
                <div style="color: var(--revenue-color); font-weight: bold; font-size: 14px; margin-bottom: 10px; text-align: center;">
                    <i class="fas fa-hand-holding-dollar"></i> إدخال دفعة من شركة
                </div>
                <input type="number" inputmode="numeric" id="companyAmt" class="input-ui" placeholder="المبلغ المستلم" style="margin-bottom: 10px;">
                <select id="companyDesc" class="input-ui">
                    <option value="دفعة مقدمة (Down Payment)">دفعة مقدمة (Down Payment)</option>
                    <option value="مستخلص جاري (Progress Payment)">مستخلص جاري (Progress Payment)</option>
                    <option value="دفعة توريد خامات">دفعة توريد خامات</option>
                    <option value="دفعة ختامية (Final Payment)">دفعة ختامية (Final Payment)</option>
                </select>
                <button class="btn-primary" style="background-color: var(--revenue-color); color: #000; margin-top: 10px;" onclick="submitCompanyRevenue()">
                    تأكيد حفظ الدفعة
                </button>
            </div>

            <div class="hidden-element" id="financeContent" style="display: none; flex-direction: column; gap: 15px;">
                <div class="stats-grid stats-hud-row">
                    <div class="hud-box prime">
                        <h4 id="currentActiveProjectTitle">الصافي المتبقي</h4>
                        <div class="val" id="netBalance" style="color: var(--primary);">0</div>
                    </div>
                    <div class="hud-box">
                        <h4>الإيرادات (+)</h4>
                        <div class="val" id="totalIncome" style="color: var(--success);">0</div>
                    </div>
                    <div class="hud-box">
                        <h4>المصروفات (-)</h4>
                        <div class="val" id="totalExpense" style="color: var(--danger);">0</div>
                    </div>
                </div>

                <div class="card">
                    <div class="tabs">
                        <button class="tab-btn active" id="incBtn" onclick="switchTab('income')">إيراد</button>
                        <button class="tab-btn" id="expBtn" onclick="switchTab('expense')">مصروف</button>
                    </div>

                    <div id="inputForm">
                        <div class="label-group" id="catGroup" style="display:none;">
                             <label>تصنيف المصروف</label>
                             <select id="expenseCategory" class="input-ui">
                                 <option value="خامات">خامات Steel</option>
                                 <option value="نثريات">نثريات موقع</option>
                                 <option value="عمالة">يوميات وعمالة</option>
                                 <option value="نقل">نقل وتوريد</option>
                             </select>
                         </div>
                        <div class="label-group">
                            <input type="number" inputmode="numeric" id="amount" class="input-ui" placeholder="أدخل المبلغ (ج.م)">
                        </div>
                        <div class="label-group">
                            <input type="text" id="desc" class="input-ui" placeholder="اكتب البيان / التفاصيل...">
                        </div>
                        <button class="btn-primary" onclick="handleAdd()" style="margin-top: 5px;">
                            <i class="fas fa-check-double"></i> حفظ العملية اللحظية
                        </button>
                    </div>
                </div>

                <div class="logs-list" id="logBody"></div>
            </div>

        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD02QWlxSjgHXLH9pZoPkXnIv5oLCsqEjk",
            authDomain: "perfect-steel.firebaseapp.com",
            databaseURL: "https://perfect-steel-default-rtdb.firebaseio.com/", 
            projectId: "perfect-steel",
            storageBucket: "perfect-steel.appspot.com",
            messagingSenderId: "971478055068",
            appId: "1:971478055068:web:ec9317054c6e7553f29559",
            measurementId: "G-GQLCKE4S7M"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentMode = 'income';
        const PASSWORDS = { "mostafa": "1519", "ahmed": "222", "mohamed": "333" };

        (function initTheme() {
            const savedTheme = localStorage.getItem("theme") || "dark";
            document.documentElement.setAttribute("data-theme", savedTheme);
            window.addEventListener('DOMContentLoaded', () => {
                updateMenuThemeUI(savedTheme);
            });
        })();

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute("data-theme");
            const newTheme = currentTheme === "light" ? "dark" : "light";
            document.documentElement.setAttribute("data-theme", newTheme);
            localStorage.setItem("theme", newTheme);
            updateMenuThemeUI(newTheme);
        }

        function updateMenuThemeUI(theme) {
            const icon = document.getElementById("menuThemeIcon");
            const statusText = document.getElementById("menuThemeStatus");
            if (icon && statusText) {
                if (theme === "light") {
                    icon.className = "fas fa-sun";
                    statusText.innerText = "وضع نهاري";
                } else {
                    icon.className = "fas fa-moon";
                    statusText.innerText = "وضع ليلي";
                }
            }
        }

        // 🛠️ إصلاح دالة التحقق الحيوية لضمان عدم القفش مطلقاً
        function checkUserAuth() {
            let user = document.getElementById("userSelect").value;
            let saved = localStorage.getItem("pass_" + user);
            
            if (saved === PASSWORDS[user] || prompt("برجاء إدخال الرقم السري:") === PASSWORDS[user]) {
                localStorage.setItem("pass_" + user, PASSWORDS[user]);
                
                // 1. تفعيل وعرض بادج الاسم جوه الهيدر فوراً وبدون تعليق كلاسات
                document.getElementById("headerUserNameSpan").innerText = "Eng: " + user.toUpperCase();
                document.getElementById("headerUserBadge").style.display = "flex";
                document.getElementById("sidebarUserName").innerText = "Eng: " + user.toUpperCase();
                
                // 2. إخفاء صندوق الدخول وعرض زرار المنيو الـ 3 شرط
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("menuBtn").classList.add("visible");
                
                // 3. فتح الأبلكيشن والواجهة كلياً وبدون انتظار طويل
                document.getElementById("mainContent").classList.add("visible");
                
                let revenueCard = document.getElementById("revenueCard");
                if (user === "ahmed") {
                    revenueCard.classList.remove("hidden-element");
                    revenueCard.style.display = "block";
                } else {
                    revenueCard.classList.add("hidden-element");
                    revenueCard.style.display = "none";
                }
            } else {
                alert("❌ الرقم السري خطأ!");
                document.getElementById("userSelect").selectedIndex = 0;
            }
        }

        function toggleSidebar(open) {
            let sidebar = document.getElementById("sidebarMenu");
            let overlay = document.getElementById("sidebarOverlay");
            sidebar.classList.toggle("open", open);
            overlay.style.display = open ? "block" : "none";
        }

        function onProjectChange() {
            let proj = document.getElementById("projectSelect").value;
            let user = document.getElementById("userSelect").value;
            
            document.getElementById("headerProjName").innerText = proj;
            document.getElementById("headerProjBadge").style.display = "flex";
            document.getElementById("projectSelectorCard").classList.add("hide-completely");
            
            let financeContent = document.getElementById("financeContent");
            financeContent.classList.remove("hidden-element");
            financeContent.style.display = "flex";
            
            document.getElementById("currentActiveProjectTitle").innerText = proj;
            
            showLoad(true);
            database.ref('transactions').on('value', (snap) => {
                let list = [];
                let data = snap.val();
                if(data) {
                    for(let id in data) {
                        if(data[id].project === proj && data[id].engineer === user) {
                            list.push({...data[id], id});
                        }
                    }
                }
                renderUI(list.reverse());
                showLoad(false);
            });
        }

        function resetProjectSelection() {
            document.getElementById("projectSelectorCard").classList.remove("hide-completely");
            document.getElementById("headerProjBadge").style.display = "none";
            document.getElementById("projectSelect").selectedIndex = 0;
            
            let financeContent = document.getElementById("financeContent");
            financeContent.classList.add("hidden-element");
            financeContent.style.display = "none";
        }

        function triggerLogOut() {
            if(confirm("هل تريد تسجيل الخروج؟")) {
                const currentTheme = localStorage.getItem("theme");
                localStorage.clear(); sessionStorage.clear();
                if (currentTheme) localStorage.setItem("theme", currentTheme);
                
                toggleSidebar(false);
                document.getElementById("headerUserBadge").style.display = "none";
                document.getElementById("headerProjBadge").style.display = "none";
                document.getElementById("projectSelectorCard").classList.remove("hide-completely");
                
                let revenueCard = document.getElementById("revenueCard");
                revenueCard.classList.add("hidden-element");
                revenueCard.style.display = "none";
                
                document.getElementById("loginBox").style.display = "block";
                document.getElementById("menuBtn").classList.remove("visible");
                document.getElementById("mainContent").classList.remove("visible");
                
                let financeContent = document.getElementById("financeContent");
                financeContent.classList.add("hidden-element");
                financeContent.style.display = "none";
                
                document.getElementById("userSelect").selectedIndex = 0;
                document.getElementById("projectSelect").selectedIndex = 0;
            }
        }

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById("incBtn").className = "tab-btn " + (mode==='income'?'active':'');
            document.getElementById("expBtn").className = "tab-btn " + (mode==='expense'?'active':'');
            document.getElementById("catGroup").style.display = (mode==='expense'?'block':'none');
        }

        function submitCompanyRevenue() {
            let amt = parseFloat(document.getElementById("companyAmt").value) || 0;
            let desc = document.getElementById("companyDesc").value;
            if(amt <= 0) return;
            database.ref('transactions').push({
                project: document.getElementById("projectSelect").value,
                engineer: document.getElementById("userSelect").value, type: 'income', category: 'دفعة شركة', amount: amt, desc: desc, date: new Date().toISOString().split('T')[0], ts: Date.now()
            }).then(() => { document.getElementById("companyAmt").value = ""; alert("💰 تم حفظ دفعة الشركة!"); });
        }

        function handleAdd() {
            let amt = parseFloat(document.getElementById("amount").value);
            let dsc = document.getElementById("desc").value;
            if(!amt || !dsc) return alert("❌ برجاء ملء البيانات أولاً");
            database.ref('transactions').push({
                project: document.getElementById("projectSelect").value,
                engineer: document.getElementById("userSelect").value, type: currentMode,
                category: currentMode==='income'?'عام':document.getElementById("expenseCategory").value,
                amount: amt, desc: dsc, date: new Date().toISOString().split('T')[0], ts: Date.now()
            }).then(() => { document.getElementById("amount").value = ""; document.getElementById("desc").value = ""; });
        }

        function renderUI(items) {
            let inc = 0, exp = 0, html = "";
            items.forEach(i => {
                if(i.type === 'income') inc += i.amount; else exp += i.amount;
                html += `
                    <div class="log-item ${i.type}">
                        <div class="log-info">
                            <h5>${i.desc}</h5>
                            <p>${i.category} • ${i.engineer}</p>
                        </div>
                        <div style="display:flex; align-items:center;">
                            <div class="log-amount">
                                <span class="amt" style="color:${i.type==='income'?'var(--success)':'var(--danger)'}">
                                    ${i.type==='income'?'+':'-'}${i.amount.toLocaleString()}
                                </span>
                                <span class="date">${i.date || '-'}</span>
                            </div>
                            <button class="btn-del" onclick="delItem('${i.id}')"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                `;
            });
            document.getElementById("logBody").innerHTML = html;
            document.getElementById("totalIncome").innerText = inc.toLocaleString();
            document.getElementById("totalExpense").innerText = exp.toLocaleString();
            document.getElementById("netBalance").innerText = (inc - exp).toLocaleString() + " ج.م";
        }

        function delItem(id) { if(confirm("هل أنت متأكد من الحذف؟")) database.ref('transactions').child(id).remove(); }
        function showLoad(s) { document.getElementById("loading").style.display = s?'flex':'none'; }
        function addCustomProject() { let p = prompt("اسم المشروع الجديد:"); if(p) document.getElementById("projectSelect").add(new Option(p, p)); }
        function addCustomEmployee() { alert("تم التفعيل."); }
    </script>
</body>
</html>
