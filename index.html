<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Steel Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --primary: #FF6B00; 
            --primary-dark: #E66000;
            --bg-body: #0B0F19; 
            --bg-card: rgba(30, 41, 59, 0.65);
            --text-main: #F8FAFC;
            --text-dim: #94A3B8;
            --success: #10B981;
            --danger: #EF4444;
            --border: rgba(255, 255, 255, 0.08);
            --radius: 16px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Noto Kufi Arabic', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0; padding: 0;
            overflow-x: hidden; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            position: relative;
        }

        /* الخلفية السينمائية المتحركة */
        .bg-fixed {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background-image: linear-gradient(rgba(11, 15, 25, 0.75), rgba(11, 15, 25, 0.85)), 
            url('https://images.unsplash.com/photo-1541888946425-d81bb19240f5?q=80&w=1200');
            background-size: cover; background-position: center;
            animation: kenBurns 25s infinite alternate ease-in-out;
        }
        @keyframes kenBurns {
            0% { transform: scale(1); } 100% { transform: scale(1.08); }
        }

        header {
            width: 100%; padding: 20px; text-align: center;
            backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.4); z-index: 10;
        }
        .logo h1 { color: var(--primary); font-size: 24px; margin: 0; font-weight: 900; letter-spacing: 1px; }

        /* حاوية الأبلكيشن الرئيسية */
        .app-container {
            width: 100%; max-width: 480px; padding: 20px 15px 40px; z-index: 5;
            position: relative; display: flex; flex-direction: column; gap: 20px;
        }

        /* 🏎️ أنيميشن صندوق تسجيل الدخول السحري */
        .login-box {
            background: var(--bg-card); border-radius: var(--radius); padding: 22px;
            border: 1px solid var(--border); backdrop-filter: blur(16px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            width: 100%; transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative; top: 0; transform: none;
        }

        /* الحركة لما ينجح الدخول: يطير فوق ويمين ويصغر */
        .login-box.logged-in {
            position: sticky; top: 10px; z-index: 100;
            margin-right: auto; margin-left: 0; width: 170px; padding: 10px 15px;
            border-color: var(--primary); box-shadow: 0 4px 15px rgba(255, 107, 0, 0.2);
        }

        .hide-on-login { opacity: 1; transition: 0.3s; }
        .logged-in .hide-on-login { display: none !important; }
        
        .user-badge { display: none; align-items: center; justify-content: center; gap: 8px; }
        .logged-in .user-badge { display: flex; }
        .user-badge i { color: var(--primary); font-size: 16px; }
        .user-badge span { font-size: 12px; font-weight: bold; white-space: nowrap; }

        /* محتوى الحسابات (بيظهر بانسيابية بعد الدخول) */
        .main-content {
            display: none; opacity: 0; transform: translateY(20px);
            transition: all 0.6s ease; width: 100%;
        }
        .main-content.visible { display: flex; flex-direction: column; gap: 20px; opacity: 1; transform: translateY(0); }

        /* التنسيقات العامة للبطاقات والمدخلات */
        .card {
            background: var(--bg-card); border-radius: var(--radius); padding: 22px;
            border: 1px solid var(--border); backdrop-filter: blur(16px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .label-group label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-dim); font-weight: bold; }
        
        .input-ui {
            width: 100%; background-color: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 14px; color: white; font-size: 15px; font-family: inherit; outline: none; transition: 0.3s;
        }
        .input-ui:focus { border-color: var(--primary); }
        select.input-ui { cursor: pointer; color: var(--primary); font-weight: bold; }

        /* Dashboard HUD */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-box { background: var(--bg-card); padding: 18px 12px; border-radius: var(--radius); text-align: center; border: 1px solid var(--border); backdrop-filter: blur(16px); }
        .stat-box.full { grid-column: span 2; border-top: 3px solid var(--primary); }
        .stat-box h4 { margin: 0; font-size: 12px; color: var(--text-dim); }
        .stat-box .val { margin: 8px 0 0; font-size: 22px; font-weight: 900; }

        /* Tabs */
        .tabs { display: flex; background: rgba(15, 23, 42, 0.8); padding: 5px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; color: var(--text-dim); font-weight: bold; border-radius: 8px; cursor: pointer; font-family: inherit; }
        .tab-btn.active { background: var(--primary); color: white; }

        .btn-primary {
            width: 100%; padding: 16px; background-color: var(--primary); color: white; border: none; border-radius: 12px;
            font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: inherit;
        }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-outline { padding: 12px; background: rgba(15, 23, 42, 0.4); border: 1px solid rgba(255,255,255,0.1); color: var(--text-main); border-radius: 8px; font-size: 12px; cursor: pointer; text-decoration: none; text-align: center; }

        /* Logs Feed */
        .log-item {
            background: var(--bg-card); border-radius: 14px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(16px);
        }
        .log-item.income { border-left: 4px solid var(--success); }
        .log-item.expense { border-left: 4px solid var(--danger); }
        .log-info h5 { margin: 0; font-size: 15px; font-weight: 700; }
        .log-info p { margin: 5px 0 0; font-size: 11px; color: var(--text-dim); }
        .log-amount { text-align: left; }
        .log-amount .amt { display: block; font-size: 16px; font-weight: 800; }
        .log-amount .date { font-size: 10px; color: var(--text-dim); }

        .btn-del { background: rgba(239, 68, 68, 0.12); color: var(--danger); border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-right: 10px; }

        .loading-shimmer { position: fixed; top: 0; left:0; width: 100%; height: 100%; background: rgba(11, 15, 25, 0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .hidden { display: none !important; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="bg-fixed"></div>

    <div class="loading-shimmer" id="loading">
        <i class="fas fa-cog fa-spin" style="font-size: 40px; color: var(--primary);"></i>
        <p style="margin-top: 15px; font-weight: bold;">جاري التحميل الفوري... ⚡</p>
    </div>

    <header>
        <div class="logo"><h1>PERFECT STEEL</h1></div>
    </header>

    <div class="app-container">
        
        <div class="login-box" id="loginBox">
            <div class="hide-on-login">
                <div class="label-group">
                    <label><i class="fas fa-user-gear" style="color: var(--primary);"></i> تسجيل دخول المهندس المسؤول</label>
                    <select class="input-ui" id="userSelect" onchange="checkUserAuth()">
                        <option value="" disabled selected>اختر اسمك من هنا..</option>
                        <option value="mostafa">Eng: Mostafa</option>
                        <option value="ahmed">Eng: Ahmed</option>
                        <option value="mohamed">Eng: Mohamed</option>
                    </select>
                </div>
            </div>

            <div class="user-badge">
                <i class="fas fa-user-hard-hat"></i>
                <span id="badgeName">Eng: User</span>
            </div>
        </div>

        <div class="main-content" id="mainContent">
            
            <div class="card">
                <div class="label-group">
                    <label><i class="fas fa-cubes" style="color: var(--primary);"></i> اختيار موقع العمل الحالي</label>
                    <select class="input-ui" id="projectSelect" onchange="onProjectChange()">
                        <option value="" disabled selected>اختر المشروع للمتابعة..</option>
                        <option value="New Cairo">New Cairo</option>
                        <option value="Old Cairo">Old Cairo</option>
                        <option value="Helwan">Helwan</option>
                        <option value="Ismailia">Ismailia</option>
                    </select>
                </div>
                <button class="btn-primary hidden" id="revenueBtn" onclick="toggleRevenueCard()" style="background: #D97706; margin-top: 10px;">
                    <i class="fas fa-wallet"></i> إدخال دفعة شركة
                </button>
                
                <div class="admin-grid hidden" id="adminBox" style="margin-top: 15px;">
                    <button class="btn-outline" onclick="addCustomProject()"><i class="fas fa-plus"></i> مشروع</button>
                    <button class="btn-outline" onclick="addCustomEmployee()"><i class="fas fa-user-plus"></i> مهندس</button>
                    <a class="btn-outline" href="https://docs.google.com/spreadsheets/d/1k5KcOhR8XTzS0kAi-SWM7OJE0oCLvoKuAK9RfE4EmAg/edit" target="_blank"><i class="fas fa-file-invoice-dollar"></i> المرتبات</a>
                    <a class="btn-outline" href="https://docs.google.com/spreadsheets/d/1I9QkNu2qjRFUTJcMuL3qo5f7scQaxQT_t-OVdm7ujVI/edit" target="_blank"><i class="fas fa-calendar-check"></i> الحضور</a>
                </div>
            </div>

            <div class="hidden" id="financeContent">
                <div class="stats-grid">
                    <div class="stat-box full">
                        <h4>الرصيد المتبقي (الصافي)</h4>
                        <div class="val" id="netBalance" style="color: var(--primary);">0.00 ج.م</div>
                    </div>
                    <div class="stat-box">
                        <h4>إجمالي الإيراد (+)</h4>
                        <div class="val" id="totalIncome" style="color: var(--success);">0.00 ج.م</div>
                    </div>
                    <div class="stat-box">
                        <h4>إجمالي المصروف (-)</h4>
                        <div class="val" id="totalExpense" style="color: var(--danger);">0.00 ج.م</div>
                    </div>
                </div>

                <div class="card">
                    <div class="tabs">
                        <button class="tab-btn active" id="incBtn" onclick="switchTab('income')">إيراد</button>
                        <button class="tab-btn" id="expBtn" onclick="switchTab('expense')">مصروف</button>
                    </div>

                    <div id="inputForm">
                        <div class="label-group" id="catGroup" style="display:none;">
                             <label>تصنيف المصروف</label>
                             <select id="expenseCategory" class="input-ui">
                                 <option value="خامات">خامات Steel</option>
                                 <option value="نثريات">نثريات موقع</option>
                                 <option value="عمالة">يوميات وعمالة</option>
                                 <option value="نقل">نقل وتوريد</option>
                             </select>
                         </div>
                        <div class="label-group">
                            <input type="number" id="amount" class="input-ui" placeholder="أدخل المبلغ المستحق (ج.م)">
                        </div>
                        <div class="label-group">
                            <input type="text" id="desc" class="input-ui" placeholder="اكتب التفاصيل / البيان هنا...">
                        </div>
                        <button class="btn-primary" onclick="handleAdd()">
                            <i class="fas fa-check-double"></i> حفظ وتأكيد العملية
                        </button>
                    </div>
                </div>

                <div class="logs-list" id="logBody"></div>
            </div>

        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD02QWlxSjgHXLH9pZoPkXnIv5oLCsqEjk",
            authDomain: "perfect-steel.firebaseapp.com",
            databaseURL: "https://perfect-steel-default-rtdb.firebaseio.com/", 
            projectId: "perfect-steel",
            storageBucket: "perfect-steel.appspot.com",
            messagingSenderId: "971478055068",
            appId: "1:971478055068:web:ec9317054c6e7553f29559",
            measurementId: "G-GQLCKE4S7M"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentMode = 'income';
        const PASSWORDS = { "mostafa": "1519", "ahmed": "222", "mohamed": "333" };

        function checkUserAuth() {
            let user = document.getElementById("userSelect").value;
            let saved = localStorage.getItem("pass_" + user);
            
            if (saved === PASSWORDS[user] || prompt("برجاء إدخال كلمة المرور:") === PASSWORDS[user]) {
                localStorage.setItem("pass_" + user, PASSWORDS[user]);
                
                // 🎬 إطلاق أنيميشن الطيران الفوري
                document.getElementById("badgeName").innerText = "Eng: " + user.toUpperCase();
                document.getElementById("loginBox").classList.add("logged-in");
                
                // إظهار باقي السيستم بعد الطيران بـ 300 ملي ثانية
                setTimeout(() => {
                    let content = document.getElementById("mainContent");
                    content.classList.add("visible");
                    document.getElementById("adminBox").classList.remove("hidden");
                    if (user === "ahmed") document.getElementById("revenueBtn").classList.remove("hidden");
                }, 300);

            } else {
                alert("❌ كلمة المرور غير صحيحة!");
                document.getElementById("userSelect").selectedIndex = 0;
            }
        }

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById("incBtn").className = "tab-btn " + (mode==='income'?'active':'');
            document.getElementById("expBtn").className = "tab-btn " + (mode==='expense'?'active':'');
            document.getElementById("catGroup").style.display = (mode==='expense'?'block':'none');
        }

        function onProjectChange() {
            let proj = document.getElementById("projectSelect").value;
            let user = document.getElementById("userSelect").value;
            document.getElementById("financeContent").classList.remove("hidden");
            
            showLoad(true);
            database.ref('transactions').on('value', (snap) => {
                let list = [];
                let data = snap.val();
                if(data) {
                    for(let id in data) {
                        if(data[id].project === proj && data[id].engineer === user) {
                            list.push({...data[id], id});
                        }
                    }
                }
                renderUI(list.reverse());
                showLoad(false);
            });
        }

        function handleAdd() {
            let amt = parseFloat(document.getElementById("amount").value);
            let dsc = document.getElementById("desc").value;
            if(!amt || !dsc) return alert("❌ برجاء ملء الحقول المطلوبة أولاً");

            let today = new Date();
            let date = today.toISOString().split('T')[0];

            database.ref('transactions').push({
                project: document.getElementById("projectSelect").value,
                engineer: document.getElementById("userSelect").value,
                type: currentMode,
                category: currentMode==='income'?'عام':document.getElementById("expenseCategory").value,
                amount: amt,
                desc: dsc,
                date: date,
                ts: Date.now()
            }).then(() => {
                document.getElementById("amount").value = "";
                document.getElementById("desc").value = "";
            });
        }

        function renderUI(items) {
            let inc = 0, exp = 0, html = "";
            items.forEach(i => {
                if(i.type === 'income') inc += i.amount; else exp += i.amount;
                html += `
                    <div class="log-item ${i.type}">
                        <div class="log-info">
                            <h5>${i.desc}</h5>
                            <p>${i.category} • ${i.engineer}</p>
                        </div>
                        <div style="display:flex; align-items:center;">
                            <div class="log-amount">
                                <span class="amt" style="color:${i.type==='income'?'var(--success)':'var(--danger)'}">
                                    ${i.type==='income'?'+':'-'}${i.amount.toLocaleString()} ج.م
                                </span>
                                <span class="date">${i.date || '-'}</span>
                            </div>
                            <button class="btn-del" onclick="delItem('${i.id}')"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                `;
            });
            document.getElementById("logBody").innerHTML = html;
            document.getElementById("totalIncome").innerText = inc.toLocaleString() + " ج.م";
            document.getElementById("totalExpense").innerText = exp.toLocaleString() + " ج.م";
            document.getElementById("netBalance").innerText = (inc - exp).toLocaleString() + " ج.م";
        }

        function delItem(id) { if(confirm("هل أنت متأكد من حذف هذه العملية؟")) database.ref('transactions').child(id).remove(); }
        function showLoad(s) { document.getElementById("loading").style.display = s?'flex':'none'; }
        function addCustomProject() { let p = prompt("اسم المشروع الجديد:"); if(p) document.getElementById("projectSelect").add(new Option(p, p)); }
        function addCustomEmployee() { alert("تم فتح ميزة الإضافة الفورية."); }
    </script>
</body>
</html>
